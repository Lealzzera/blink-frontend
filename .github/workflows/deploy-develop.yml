name: Build and deploy frontend

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/lealzzera/blink-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BLINK_BE_PUBLIC_WS_URL: ${{ vars.NEXT_PUBLIC_BLINK_BE_PUBLIC_WS_URL }}
      NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_BLINK_BE_BASE_URL: ${{ vars.NEXT_PUBLIC_BLINK_BE_BASE_URL }}
      NEXT_PUBLIC_STRIPE_PUBLIC_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar variáveis do frontend
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            NEXT_PUBLIC_BLINK_BE_BASE_URL
            NEXT_PUBLIC_BLINK_BE_PUBLIC_WS_URL
            NEXT_PUBLIC_STRIPE_PUBLIC_KEY
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::$var_name não foi encontrada ou está vazia nas Repository Variables"
              exit 1
            fi
          done

          case "$NEXT_PUBLIC_STRIPE_PUBLIC_KEY" in
            pk_test_*|pk_live_*)
              echo "Stripe public key encontrada e possui formato válido."
              ;;
            *)
              echo "::error::NEXT_PUBLIC_STRIPE_PUBLIC_KEY deve começar com pk_test_ ou pk_live_"
              exit 1
              ;;
          esac

          echo "Variáveis obrigatórias validadas."

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_BLINK_BE_PUBLIC_WS_URL=${{ env.NEXT_PUBLIC_BLINK_BE_PUBLIC_WS_URL }}
            NEXT_PUBLIC_BASE_URL=${{ env.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_BLINK_BE_BASE_URL=${{ env.NEXT_PUBLIC_BLINK_BE_BASE_URL }}
            NEXT_PUBLIC_STRIPE_PUBLIC_KEY=${{ env.NEXT_PUBLIC_STRIPE_PUBLIC_KEY }}
          tags: |
            ${{ env.IMAGE_NAME }}:develop
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Configurar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hetzner
          chmod 600 ~/.ssh/hetzner
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Atualizar frontend
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/hetzner \
            "${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }}" \
            'set -e
             cd /opt/blinki
             docker compose pull frontend
             docker compose up -d --no-deps --force-recreate frontend
             docker image prune -f
             docker compose ps frontend'
